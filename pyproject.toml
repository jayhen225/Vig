[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parlay"
version = "0.1.0"
description = "A correlation-aware NFL parlay pricing engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.4.5",
    "nflreadpy>=0.1.5",
    "polars>=1.36.1",
    "pyarrow>=21.0.0",
    "numpy",
    "scipy",
    "pydantic",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["parlay"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so tests can import the top-level `pipeline`
# package (the installed wheel only contains `parlay`).
pythonpath = ["."]