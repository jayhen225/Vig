[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parlay"
version = "0.1.0"
description = "A correlation-aware NFL parlay pricing engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.4.5",
    "numpy",
    "pydantic",
    "fastapi",
    "uvicorn",
]

[tool.vercel]
entrypoint = "parlay.api.main:app"

[project.optional-dependencies]
# Data ingestion/training deps -- not needed to serve the API (parlay/api/*),
# only imported by parlay/pipeline/* and the optional real pricer
# (parlay/core/layer5_pricer.py, which degrades to an estimate when these
# are absent). Kept out of the base deps so the Vercel function bundle
# stays under the platform's size limit.
pipeline = [
    "nflreadpy>=0.1.5",
    "polars>=1.36.1",
    "pyarrow>=21.0.0",
    "scipy",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.7.2",
    "fastexcel>=0.21.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
]
dev = [
    "parlay[pipeline]",
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["parlay"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Manual, print-and-continue test/demo harnesses (not collected by pytest).
"parlay/core/resolutions_tests.py" = ["BLE001"]
"parlay/core/test_schemas_manual.py" = ["BLE001"]
# Broad excepts keep a long historical-pull loop going when one request fails.
"parlay/pipeline/pull_historical_props.py" = ["BLE001"]
# Unsupported-leg-type guard intentionally raises ValueError (its public API).
"parlay/core/resolution.py" = ["TRY004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so tests can import the top-level `pipeline`
# package (the installed wheel only contains `parlay`).
pythonpath = ["."]
