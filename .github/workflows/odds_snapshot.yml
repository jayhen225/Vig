name: Odds snapshot

on:
  # Manual trigger. Use this FIRST to test, and to see how many API credits one
  # run costs (look for "Credits remaining" in the log) BEFORE enabling the
  # schedule below.
  workflow_dispatch:

  # TEMPORARY: hourly captures during game windows for real line-movement
  # data, while the higher-tier key (20,000 credits) is active through
  # Sep 26. At ~96 credits/run (6 markets x 1 region x ~16 events), this
  # window (Thu/Sun/Mon night football + full Sunday slate) costs
  # ~2,200 credits/week -- well inside the 20k budget through the 26th.
  #
  # SWITCH BACK once the free-tier key (500 credits/month) is in: replace
  # the block below with a single weekly cron, e.g.
  #   - cron: "0 18 * 9-12,1-2 4"   # Thursday 18:00 UTC, once/week
  # A full slate is ~96 credits/run -- weekly leaves headroom for manual
  # re-runs within the free tier's 500/month; the schedule below would
  # blow through that in under a week on the free key.
  schedule:
    # Thursday Night Football: 23:00 Thu -> 03:00 Fri
    - cron: "0 23 * 9-12,1-2 4"
    - cron: "0 0-3 * 9-12,1-2 5"
    # Sunday slate: 17:00 Sun -> 05:00 Mon
    - cron: "0 17-23 * 9-12,1-2 0"
    - cron: "0 0-5 * 9-12,1-2 1"
    # Monday Night Football: 23:00 Mon -> 03:00 Tue
    - cron: "0 23 * 9-12,1-2 1"
    - cron: "0 0-3 * 9-12,1-2 2"

# The job commits new snapshot files back to the repo, so it needs write access.
permissions:
  contents: write

# Never let two snapshot runs push at the same time (queue, don't cancel --
# every snapshot matters).
concurrency:
  group: odds-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # snapshot_odds.py is pure standard library; devig_odds.py imports
      # parlay.core.devig and needs duckdb + polars, so install the project
      # (editable) with the pipeline extra.
      - name: Install dependencies
        run: pip install -e ".[pipeline]"

      - name: Capture player-prop odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python parlay/pipeline/snapshot_odds.py

      - name: Devig player props into the warehouse
        run: python parlay/pipeline/devig_odds.py

      # Cheap (~1 credit/event vs. ~6 for player props), so captured every
      # run alongside props rather than on its own schedule.
      - name: Capture game-line odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python parlay/pipeline/snapshot_lines.py

      - name: Devig game lines into the warehouse
        run: python parlay/pipeline/devig_lines.py

      - name: Commit snapshots + warehouse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add parlay/data/odds_raw parlay/data/odds_raw_lines parlay/data/nfl_data.duckdb
          if git diff --staged --quiet; then
            echo "No new snapshot to commit."
          else
            git commit -m "Odds snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          fi
