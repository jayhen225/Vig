name: Odds snapshot

on:
  # Manual trigger. Use this FIRST to test, and to see how many API credits one
  # run costs (look for "Credits remaining" in the log) BEFORE enabling the
  # schedule below.
  workflow_dispatch:

  # Once a week, Thursday 18:00 UTC (~1-2pm US Eastern), in-season only
  # (Sep-Feb) -- most books have posted that week's player props by
  # Thursday. Kept to once/week deliberately: this endpoint costs
  # markets x regions credits per event (6 markets x 1 region here), and a
  # full ~16-game slate runs ~96 credits -- the free tier's 500 credits/month
  # only covers ~5 runs, so anything more frequent (e.g. per-game-window
  # captures for line movement) needs a paid API tier.
  schedule:
    - cron: "0 18 * 9-12,1-2 4"

# The job commits new snapshot files back to the repo, so it needs write access.
permissions:
  contents: write

# Never let two snapshot runs push at the same time (queue, don't cancel --
# every snapshot matters).
concurrency:
  group: odds-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # snapshot_odds.py is pure standard library; devig_odds.py imports
      # parlay.core.devig and needs duckdb + polars, so install the project
      # (editable) with the pipeline extra.
      - name: Install dependencies
        run: pip install -e ".[pipeline]"

      - name: Capture odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python parlay/pipeline/snapshot_odds.py

      - name: Devig snapshot into the warehouse
        run: python parlay/pipeline/devig_odds.py

      - name: Commit snapshot + warehouse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add parlay/data/odds_raw parlay/data/nfl_data.duckdb
          if git diff --staged --quiet; then
            echo "No new snapshot to commit."
          else
            git commit -m "Odds snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          fi
